name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r services/api/requirements.txt
      - name: Run drawing and access tests
        working-directory: services/api
        run: pytest -q tests/test_process_pfd.py tests/test_admin_access.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          APP_BASE_PATH: ""
          NEXT_PUBLIC_APP_BASE_PATH: ""
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1/drug-discovery
        run: npm run build:web
